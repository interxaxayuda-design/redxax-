
[functions.gemini-proxy]
enabled = true
verify_jwt = true
import_map = "./functions/gemini-proxy/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/gemini-proxy/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/gemini-proxy/*.html" ]
[
functions.benchmark-collector
    ]
verify_jwt = false

[
 functions.benchmark-collector.cron
]
schedule = "0 4 * * 1"   # Lunes 4am UTC cada semana
